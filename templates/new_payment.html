{% extends "base.html" %}
{% set active = "payments" %}
{% block title %}Record Payment · My Lending{% endblock %}
{% block content %}
<div class="page-head">
    <h1>Record Payment</h1>
    <p>Apply a repayment to an active loan.</p>
</div>
<div class="panel form-panel" style="padding:24px;">
    <form method="post">
        <div class="field">
            <label for="loan_id">Loan</label>
            <select id="loan_id" name="loan_id" required>
                {% for choice in choices %}
                <option value="{{ choice['id'] }}">{{ choice['id'] }} — {{ choice['borrower'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="amount">Amount received (&#8369;)</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
        </div>
        <div class="field">
            <label for="paid_at">Date</label>
            <input type="date" id="paid_at" name="paid_at" value="{{ today }}" required>
        </div>
        <div class="field">
            <label for="note">Note (optional)</label>
            <input type="text" id="note" name="note">
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Payment</button>
            <a class="btn btn-ghost" href="{{ url_for('payments') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
